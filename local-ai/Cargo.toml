[package]
name = "isle-local-ai"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
[workspace]
[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mistralrs = { path = "../../mistral-rs/mistralrs", default-features = false }
[profile.release]
opt-level = 3
debug = 0
strip = true
